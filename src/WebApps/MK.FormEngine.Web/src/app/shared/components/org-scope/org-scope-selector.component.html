<div *transloco="let t" class="flex flex-col gap-3">
  <div class="grid grid-cols-1 gap-3"
       [class.sm:grid-cols-2]="true"
       [class.md:grid-cols-2]="layout() === 'grid'"
       [class.md:grid-cols-4]="layout() === 'row'">
    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">{{ t('org.cluster') }}</label>
      <p-select
        [options]="clusters()"
        [ngModel]="clusterCode()"
        (ngModelChange)="onClusterChange($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="t('org.selectCluster')"
        [showClear]="true"
        [filter]="true"
        filterBy="label"
        [loading]="loadingClusters()"
        [disabled]="disabled()"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">{{ t('org.cbu') }}</label>
      <p-select
        [options]="cbus()"
        [ngModel]="cbuCode()"
        (ngModelChange)="onCbuChange($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="t('org.selectCbu')"
        [showClear]="true"
        [filter]="true"
        filterBy="label"
        [loading]="loadingCbus()"
        [disabled]="disabled() || !clusterCode()"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-sm font-medium">{{ t('org.branch') }}</label>
      <p-select
        [options]="branches()"
        [ngModel]="branchCode()"
        (ngModelChange)="onBranchChange($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="t('org.selectBranch')"
        [showClear]="true"
        [filter]="true"
        filterBy="label"
        [loading]="loadingBranches()"
        [disabled]="disabled() || !cbuCode()"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    @if (showOperationArea()) {
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium">{{ t('org.operationArea') }}</label>
        <p-select
          [options]="operationAreas()"
          [ngModel]="operationAreaCode()"
          (ngModelChange)="onOperationAreaChange($event)"
          optionLabel="label"
          optionValue="value"
          [placeholder]="t('org.selectOperationArea')"
          [showClear]="true"
          [filter]="true"
          filterBy="label"
          [loading]="loadingOperationAreas()"
          [disabled]="disabled() || !cbuCode()"
          appendTo="body"
          styleClass="w-full"
        />
      </div>
    }
  </div>

  @if (mode() === 'multi') {
    <div class="flex flex-col gap-1 md:max-w-[calc(50%-0.375rem)]">
      <label class="text-sm font-medium">{{ t('org.department') }}</label>
      <p-select
        [options]="departments()"
        [ngModel]="departmentId()"
        (ngModelChange)="departmentId.set($event)"
        optionLabel="label"
        optionValue="value"
        [placeholder]="t('org.allDepartments')"
        [showClear]="true"
        [filter]="true"
        filterBy="label"
        [loading]="loadingDepartments()"
        [disabled]="disabled()"
        appendTo="body"
        styleClass="w-full"
      />
    </div>

    <div class="flex items-center gap-2">
      <p-button
        [label]="t('org.addScope')"
        icon="pi pi-plus"
        size="small"
        [disabled]="!canAdd()"
        (onClick)="addScope()"
      />
      <span class="text-xs text-surface-500">{{ t('org.addScopeHint') }}</span>
    </div>

    <div class="flex flex-wrap gap-2">
      @for (scope of scopes(); track scopeKey(scope)) {
        <p-chip
          [label]="scopeLabel(scope)"
          [removable]="!disabled()"
          (onRemove)="removeScope(scope)"
        />
      } @empty {
        <span class="text-sm text-surface-500">{{ t('org.noScopes') }}</span>
      }
    </div>
  }
</div>
