<ng-container *transloco="let t">
  <div class="callback-page">
    <div class="callback-card">
      <p-progress-spinner strokeWidth="4" [style]="{ width: '48px', height: '48px' }" />
      <h2>{{ t('auth.sso.completingSignIn') }}</h2>
      <p>{{ t('auth.sso.pleaseWait') }}</p>
    </div>
  </div>
</ng-container>
