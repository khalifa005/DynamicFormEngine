<ng-container *transloco="let t">
  <p-toast />
  <p-confirmDialog />

  <div class="mb-4 flex justify-end">
    <p-button [label]="t('users.newUser')" icon="pi pi-plus" (onClick)="openNew()" />
  </div>

  <div class="card p-4">
    <p-table
      [value]="users()"
      [lazy]="true"
      (onLazyLoad)="load($event)"
      [rows]="10"
      [paginator]="true"
      [totalRecords]="totalRecords()"
      [loading]="loading()"
      [rowsPerPageOptions]="[10, 25, 50]"
      styleClass="app-table p-datatable-sm p-datatable-striped"
      [scrollable]="true"
      [tableStyle]="{ 'min-width': '56rem' }"
      [rowHover]="true"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{{ t('users.pageReport') }}"
    >
      <ng-template pTemplate="caption">
        <div class="flex flex-wrap items-center justify-end gap-2">
          <p-select
            [(ngModel)]="statusFilter"
            [options]="statusOptions()"
            optionLabel="label"
            optionValue="value"
            [placeholder]="t('users.status')"
            [showClear]="true"
            (onChange)="onSearch()"
            appendTo="body"
            styleClass="w-full sm:w-48"
          />
          <p-iconfield iconPosition="left">
            <p-inputicon styleClass="pi pi-search" />
            <input
              pInputText
              type="text"
              [(ngModel)]="searchTerm"
              (keyup.enter)="onSearch()"
              [placeholder]="t('users.searchPlaceholder')"
              class="w-full sm:w-auto"
            />
          </p-iconfield>
          @if (searchTerm) {
            <p-button
              icon="pi pi-times"
              styleClass="p-button-text p-button-secondary"
              (onClick)="clearSearch()"
            />
          }
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th>{{ t('users.userName') }}</th>
          <th>{{ t('users.email') }}</th>
          <th>{{ t('users.roles') }}</th>
          <th>{{ t('users.status') }}</th>
          <th class="w-[10rem] text-right">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.userName }}</td>
          <td>{{ user.email || '—' }}</td>
          <td class="app-col-wrap w-[18rem]">
            <div class="flex flex-wrap gap-1">
              @for (role of user.roles ?? []; track role) {
                <p-tag [value]="role" severity="info" />
              } @empty {
                <span class="text-surface-400">—</span>
              }
            </div>
          </td>
          <td>
            <p-tag
              [value]="user.isEnabled ? t('users.enabled') : t('users.disabled')"
              [severity]="user.isEnabled ? 'success' : 'danger'"
            />
          </td>
          <td class="text-right">
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              [pTooltip]="t('common.edit')"
              (onClick)="openEdit(user)"
            />
            <p-button
              icon="pi pi-key"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              [pTooltip]="t('users.resetPassword')"
              (onClick)="openReset(user)"
            />
            <p-button
              [icon]="user.isEnabled ? 'pi pi-ban' : 'pi pi-check-circle'"
              [rounded]="true"
              [text]="true"
              [severity]="user.isEnabled ? 'danger' : 'success'"
              [pTooltip]="user.isEnabled ? t('users.disable') : t('users.enable')"
              [loading]="busyUserId() === user.id"
              [disabled]="busyUserId() !== null"
              (onClick)="toggleStatus(user)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="py-6 text-center text-surface-500">{{ t('users.noUsers') }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <app-user-form-dialog
    [(visible)]="formVisible"
    [user]="selectedUser()"
    (saved)="load()"
  />

  <app-user-reset-password-dialog [(visible)]="resetVisible" [user]="selectedUser()" />
</ng-container>
